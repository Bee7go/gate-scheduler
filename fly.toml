# Replace this with a globally unique Fly.io app name before the first deploy.
app = "replace-with-your-unique-fly-app-name"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "php artisan migrate --force"

[env]
  APP_DEBUG = "false"
  APP_ENV = "production"
  APP_NAME = "Airport Gate Scheduler"
  AIRPORT_ICAO = "EHAM"
  CACHE_STORE = "redis"
  DB_CONNECTION = "pgsql"
  GATE_ALLOCATION_STRATEGY = "greedy"
  GATE_OCCUPATION_TIME = "90"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "info"
  OPENSKY_VERIFY_SSL = "true"
  QUEUE_CONNECTION = "redis"
  REDIS_CLIENT = "phpredis"
  REDIS_QUEUE_RETRY_AFTER = "180"
  SESSION_DRIVER = "redis"
  SESSION_SECURE_COOKIE = "true"
  SESSION_STORE = "redis"

[processes]
  web = "/usr/local/bin/start-web"
  worker = "php artisan queue:work redis --sleep=3 --tries=3 --timeout=120 --max-time=3600 --no-interaction"
  scheduler = "php artisan schedule:work"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/up"
    timeout = "5s"

    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
